<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Animated GTM flow: signals to enrichment to scoring to outreach to pipeline">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5233"/><stop offset="0.5" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M90 95 H810"/>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .node{fill:#1a1316;stroke:url(#line);stroke-width:2}
    .lbl{fill:#fff1ec;font-size:15px;font-weight:600;text-anchor:middle}
    .sub{fill:#b79a90;font-size:11px;text-anchor:middle}
    .ring{fill:none;stroke:#ff8a5c;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 6s infinite}
    @keyframes pulse{0%{opacity:0;transform:scale(.8)}4%{opacity:.9;transform:scale(1)}16%{opacity:0;transform:scale(1.7)}100%{opacity:0}}
    .n2{animation-delay:1.2s}.n3{animation-delay:2.4s}.n4{animation-delay:3.6s}.n5{animation-delay:4.8s}
  </style>

  <rect width="900" height="190" rx="18" fill="#121014"/>

  <use href="#track" stroke="#ffffff" stroke-opacity=".12" stroke-width="3" stroke-linecap="round" fill="none"/>
  <use href="#track" stroke="url(#line)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" values="720;0;0;720" keyTimes="0;0.8;0.95;1" dur="6s" repeatCount="indefinite"/>
  </use>

  <g class="sans">
    <circle class="node" cx="90" cy="95" r="30"/><circle class="ring" cx="90" cy="95" r="30"/>
    <text class="lbl" x="90" y="146">Signals</text><text class="sub" x="90" y="163">new enquiries, replies</text>
    <text x="90" y="101" text-anchor="middle" font-size="22">&#128225;</text>

    <circle class="node" cx="270" cy="95" r="30"/><circle class="ring n2" cx="270" cy="95" r="30"/>
    <text class="lbl" x="270" y="146">Enrich</text><text class="sub" x="270" y="163">CRM kept clean</text>
    <text x="270" y="101" text-anchor="middle" font-size="22">&#129514;</text>

    <circle class="node" cx="450" cy="95" r="30"/><circle class="ring n3" cx="450" cy="95" r="30"/>
    <text class="lbl" x="450" y="146">Score</text><text class="sub" x="450" y="163">lead scoring, ~10s</text>
    <text x="450" y="101" text-anchor="middle" font-size="22">&#127919;</text>

    <circle class="node" cx="630" cy="95" r="30"/><circle class="ring n4" cx="630" cy="95" r="30"/>
    <text class="lbl" x="630" y="146">Reach out</text><text class="sub" x="630" y="163">pre-meeting briefs</text>
    <text x="630" y="101" text-anchor="middle" font-size="22">&#9993;&#65039;</text>

    <circle class="node" cx="810" cy="95" r="30"/><circle class="ring n5" cx="810" cy="95" r="30"/>
    <text class="lbl" x="810" y="146">Pipeline</text><text class="sub" x="810" y="163">qualified demos</text>
    <text x="810" y="101" text-anchor="middle" font-size="22">&#128176;</text>
  </g>

  <text x="450" y="34" class="mono" font-size="12" fill="#8a7068" text-anchor="middle">// how I design the work, then automate the repeat parts</text>

  <circle r="7" fill="#FF5233" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#track"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.85;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
